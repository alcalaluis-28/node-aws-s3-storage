<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir archivos - AWS S3</title>
  
  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Hoja de Estilos Separada -->
  <link rel="stylesheet" href="/css/index.css">
</head>
<body>
  <div class="card">
    <h1>Subir archivos AWS S3</h1>
    <p>Carga documentos y objetos a tu bucket S3 local</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label for="archivo">Seleccione archivo:</label>
        <input type="file" id="archivo" name="archivo" required>
      </div>
      <div class="actions">
        <button type="submit">Subir Archivo</button>
        <a href="/lista" class="link-lista">Ver archivos almacenados (/lista)</a>
      </div>
    </form>
  </div>
</body>
</html>
